[package]
name = "overtone-lyrics-engine"
version = "1.0.0"
edition = "2024"
authors = ["cosmo-jar"]
license = "MIT"
publish = false
description = "Overtone: Lyrics PRO MAX SUPER ULTRA MEGA GIGA PLUS engine crate for Horizon 26.3"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
png = "0.18"
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
image-webp = { version = "0.2", default-features = false }
gif = "0.14"
cpal = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
sha2 = "0.10.9"
hmac = "0.12"
base64 = "0.22"
url = "2"
open = "5.4.5"
